name: Smoke

# Boots the production build in headless Chromium and walks the main flows
# (.github/smoke/smoke.mjs). Opt-in: it runs only for `ci/smoke-*` branches
# and when started by hand, never for `main` or pull requests, so ordinary
# CI stays fast.
#
#   git push origin HEAD:ci/smoke-<name>     # run it against a commit
#   gh run list --branch ci/smoke-<name>     # read the result
#   git push origin --delete ci/smoke-<name> # and remove the branch
#
# vercel.json keeps `ci/**` branches from creating preview deployments.
on:
  push:
    branches:
      - "ci/smoke-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Pinned, like the Playwright version below: a new runner image or
    # browser build should be a deliberate change, not a surprise failure.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Playwright is installed outside the project so it never enters the
      # app's dependencies or lockfile.
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.65.1
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/.github/smoke/smoke.mjs" .

      - name: Smoke
        run: |
          pnpm preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.1 -t 60000 http://localhost:4173
          cd "$RUNNER_TEMP/pw" && node smoke.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke
          path: ${{ runner.temp }}/pw/out
          retention-days: 3
