name: CI

# Tests and a production build on a clean runner. `ci/**` branches exist so
# a work-in-progress branch can be checked remotely without opening a PR
# (`git push origin <branch>:ci/<name>`); vercel.json keeps them from
# creating preview deployments.
on:
  pull_request:
  push:
    branches:
      - main
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Bundle counts and ceilings
        run: |
          node .github/perf/bundle.mjs dist bundle-results.json
          node .github/perf/ratchet.mjs check bundle-results.json --prefix bundle.
