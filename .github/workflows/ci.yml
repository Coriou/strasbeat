name: CI

# Tests and a production build on a clean runner. `ci/**` branches exist so
# a work-in-progress branch can be checked remotely without opening a PR
# (`git push origin <branch>:ci/<name>`); vercel.json keeps them from
# creating preview deployments.
on:
  pull_request:
  push:
    branches:
      - main
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Bundle counts and ceilings
        run: |
          node .github/perf/bundle.mjs dist bundle-results.json
          node .github/perf/ratchet.mjs check bundle-results.json --prefix bundle.

      # A ceiling raised or removed needs a `raises` entry with a reason
      # (.github/perf/lib/ratchets.mjs). Compared with main, or on a push to
      # main with the commit it replaced: checked here, on every push, so the
      # rule does not depend on someone running the performance workflow.
      - name: Ceilings only go down
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=main
          if [ "$GITHUB_REF" = refs/heads/main ]; then base="$BEFORE"; fi
          if [ -z "$base" ] || ! git fetch --quiet --depth=1 origin "$base"; then
            echo "SKIPPED ratchet guard: no base commit to compare with"
            exit 0
          fi
          if ! git cat-file -e FETCH_HEAD:.github/perf/ratchets.json 2>/dev/null; then
            echo "SKIPPED ratchet guard: the base has no ratchets.json"
            exit 0
          fi
          git show FETCH_HEAD:.github/perf/ratchets.json > "$RUNNER_TEMP/base-ratchets.json"
          node .github/perf/ratchet.mjs guard "$RUNNER_TEMP/base-ratchets.json" .github/perf/ratchets.json
